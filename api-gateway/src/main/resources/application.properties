spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=rider-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://rider-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/riders/**

spring.cloud.gateway.server.webmvc.routes[2].id=driver-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://driver-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/drivers/**

spring.cloud.gateway.server.webmvc.routes[3].id=location-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://location-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/locations/**

spring.cloud.gateway.server.webmvc.routes[4].id=ride-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://ride-service
